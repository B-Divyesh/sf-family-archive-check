name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.3

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            target: ""
          - platform: ubuntu-22.04
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: Family Archive Check ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: Unsigned preview installers for macOS, Windows, and Linux. Verify downloads with SHA256SUMS.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          mkdir release-assets
          gh release download "${RELEASE_TAG}" --dir release-assets
          find release-assets -type f ! -name SHA256SUMS ! -name latest.json -print0 | sort -z | xargs -0 sha256sum | sed 's#release-assets/##' > SHA256SUMS
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > release.json
          jq '{
            version: .tag_name,
            platforms: {
              macos_arm64: ([.assets[] | select(.name | test("aarch64.*\\.dmg$"))][0].browser_download_url // null),
              macos_x64: ([.assets[] | select(.name | test("x64.*\\.dmg$"))][0].browser_download_url // null),
              windows_msi: ([.assets[] | select(.name | test("\\.msi$"))][0].browser_download_url // null),
              linux_appimage: ([.assets[] | select(.name | test("\\.AppImage$"))][0].browser_download_url // null),
              linux_deb: ([.assets[] | select(.name | test("\\.deb$"))][0].browser_download_url // null)
            },
            assets: [.assets[] | {name, url: .browser_download_url}]
          }' release.json > latest.json
          jq -e 'all(.platforms[]; . != null)' latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            SHA256SUMS
            latest.json
