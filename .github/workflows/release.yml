name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v0.1.11

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-22.04
    outputs:
      source_commit: ${{ steps.identity.outputs.source_commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and source identity
        id: identity
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected_tag="v${version}"
          requested_tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          test "$requested_tag" = "$expected_tag"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$expected_tag")"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run typecheck
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            target: ""
          - platform: ubuntu-22.04
            args: ""
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Test Windows download helper
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./tests/installers.ps1
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAC_BUILD_COMMIT: ${{ needs.verify.outputs.source_commit }}
        with:
          tagName: ${{ needs.verify.outputs.tag }}
          releaseName: Family Archive Check ${{ needs.verify.outputs.tag }}
          releaseBody: Desktop builds are being verified. Checksums and source identity will be attached before publication.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
        shell: bash
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets
          appimage="$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          native_binary="$(find squashfs-root/usr/bin -maxdepth 1 -type f -print -quit)"
          grep -aF 'recovery-file-import' "$native_binary"
          grep -aF "$SOURCE_COMMIT" "$native_binary"
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS ! -name latest.json -printf '%f\0' | sort -z | xargs -0 -I{} sha256sum "release-assets/{}" | sed 's#release-assets/##' > SHA256SUMS
          gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate > releases.json
          release_id="$(jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' releases.json | head -n 1)"
          test -n "$release_id"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" > release.json
          jq --arg source_commit "$SOURCE_COMMIT" --arg repository "$GITHUB_REPOSITORY" '{
            version: .tag_name,
            source_commit: $source_commit,
            capabilities: ["recovery-file-import"],
            metadata_api: .url,
            checksums: {
              algorithm: "SHA-256",
              url: ("https://github.com/" + $repository + "/releases/download/" + .tag_name + "/SHA256SUMS")
            },
            platforms: {
              macos_arm64: ([.assets[] | select(.name | test("aarch64.*\\.dmg$"))][0].browser_download_url // null),
              macos_x64: ([.assets[] | select(.name | test("x64.*\\.dmg$"))][0].browser_download_url // null),
              windows_msi: ([.assets[] | select(.name | test("\\.msi$"))][0].browser_download_url // null),
              linux_appimage: ([.assets[] | select(.name | test("\\.AppImage$"))][0].browser_download_url // null),
              linux_deb: ([.assets[] | select(.name | test("\\.deb$"))][0].browser_download_url // null)
            },
            assets: [.assets[] | {name, url: .browser_download_url}]
          }' release.json > latest.json
          jq -e --arg source_commit "$SOURCE_COMMIT" '.source_commit == $source_commit and (.capabilities | index("recovery-file-import")) and all(.platforms[]; . != null)' latest.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          draft: false
          prerelease: false
          body: |
            Unsigned desktop installers for macOS, Windows, and Linux.

            Source commit: ${{ needs.verify.outputs.source_commit }}
            Includes recovery-file import. Verify downloads with SHA256SUMS.
          files: |
            SHA256SUMS
            latest.json
      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.source_commit }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > published-release.json
          jq -e --arg tag "$RELEASE_TAG" --arg source "$SOURCE_COMMIT" '.tag_name == $tag and .draft == false and (.body | contains($source)) and ([.assets[].name] | index("SHA256SUMS")) and ([.assets[].name] | index("latest.json"))' published-release.json
