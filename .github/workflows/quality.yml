name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system packages
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features desktop --all-targets -- -D warnings

  production-install-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run build
      - name: Check configured outputs
        run: test -f dist/site/index.html && test -f dist/app/index.html

  windows-installer-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute valid and tampered checksum cases
        shell: pwsh
        run: ./tests/installers.ps1

  storage-codec-matrix:
    name: Storage and codec matrix (${{ matrix.filesystem }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            filesystem: APFS
            command: bash tests/storage-volume-macos.sh
          - platform: windows-latest
            filesystem: NTFS
            command: ./tests/storage-volume.ps1
          - platform: ubuntu-22.04
            filesystem: exFAT
            command: bash tests/storage-volume.sh exfat
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install exFAT tools
        if: matrix.filesystem == 'exFAT'
        run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - name: Scan valid media on the mounted target filesystem
        shell: ${{ matrix.filesystem == 'NTFS' && 'pwsh' || 'bash' }}
        run: ${{ matrix.command }}
