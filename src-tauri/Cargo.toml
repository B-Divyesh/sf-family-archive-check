[package]
name = "family_archive_check"
version = "0.1.1"
description = "Read-only recovery readiness checks for family photo archives"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "family_archive_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
